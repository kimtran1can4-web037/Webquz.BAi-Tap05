<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizWave - Nền tảng Trắc nghiệm</title>
    <style>
        :root {
            --bg-main: #f0f4f8;
            --blue-primary: #0066ff;
            --blue-hover: #0052cc;
            --blue-light: #e6f0ff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --card-bg: #ffffff;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 102, 255, 0.08);
            padding: 35px;
            border-top: 6px solid var(--blue-primary);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--blue-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-indicator {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-main);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .question-section {
            margin-bottom: 25px;
        }

        .question-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--blue-primary);
            background-color: var(--blue-light);
            transform: translateY(-1px);
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
        }

        .option-btn.wrong {
            background-color: var(--error) !important;
            border-color: var(--error) !important;
            color: white !important;
        }

        .quiz-footer {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

        .action-btn {
            background-color: var(--blue-primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .action-btn:hover {
            background-color: var(--blue-hover);
        }

        .result-container {
            text-align: center;
            padding: 20px 0;
        }

        .result-container h2 {
            font-size: 2rem;
            color: var(--blue-primary);
            margin-bottom: 15px;
        }

        .result-container p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div id="quiz-screen">
            <div class="quiz-header">
                <div class="brand">🌊 QuizWave</div>
                <div class="progress-indicator" id="progress-text">Câu 1 / 3</div>
            </div>

            <div class="question-section">
                <h2 class="question-title" id="question-text">Đang tải câu hỏi...</h2>
                <div class="options-list" id="options-container"></div>
            </div>

            <div class="quiz-footer">
                <button class="action-btn" id="next-btn" onclick="nextQuestion()">Tiếp theo →</button>
            </div>
        </div>

        <div id="result-screen" style="display: none;" class="result-container">
            <h2>Hoàn thành bài kiểm tra! 🎉</h2>
            <p id="score-text">Bạn đã trả lời đúng 0 / 3 câu hỏi.</p>
            <button class="action-btn" style="display: inline-block;" onclick="restartQuiz()">Làm lại từ đầu</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Thủ đô của Việt Nam là gì?",
                options: ["Hồ Chí Minh", "Hà Nội", "Đà Nẵng", "Cần Thơ"],
                answer: 1
            },
            {
                question: "Ngôn ngữ lập trình nào dùng để tạo tương tác cho trang web?",
                options: ["Python", "C++", "JavaScript", "Java"],
                answer: 2
            },
            {
                question: "HTML là viết tắt của cụm từ nào?",
                options: [
                    "Hyper Text Markup Language",
                    "High Tech Modern Language",
                    "Hyper Transfer Markup Language",
                    "Home Tool Markup Language"
                ],
                answer: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const progressText = document.getElementById("progress-text");
        const nextBtn = document.getElementById("next-btn");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const scoreText = document.getElementById("score-text");

        function loadQuestion() {
            nextBtn.style.display = "none";
            const currentData = quizData[currentQuestionIndex];
            
            questionText.innerText = currentData.question;
            progressText.innerText = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;
            
            optionsContainer.innerHTML = "";
            currentData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(btn, index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, selectedIndex) {
            const currentData = quizData[currentQuestionIndex];
            const allButtons = optionsContainer.children;

            for (let btn of allButtons) {
                btn.disabled = true;
            }

            if (selectedIndex === currentData.answer) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                allButtons[currentData.answer].classList.add("correct");
            }

            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.style.display = "none";
            resultScreen.style.display = "block";
            scoreText.innerText = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu hỏi!`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.style.display = "none";
            quizScreen.style.display = "block";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
